<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1b45">
<meta name="robots" content="noindex">
<title>SSV Getränkekasse · Kassenwart</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="admin">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="stander-clip"><path d="M14 8H118L94 33L118 58H14Z"/></clipPath>
    <symbol id="stander" viewBox="0 0 124 100">
      <rect x="6" y="2" width="5" height="96" rx="2.5" fill="currentColor" opacity=".55"/>
      <path d="M14 8H118L94 33L118 58H14Z" fill="#132a6b"/>
      <g clip-path="url(#stander-clip)">
        <path d="M14 8L104 58M14 58L104 8" stroke="#fff" stroke-width="15"/>
        <path d="M14 8L104 58M14 58L104 8" stroke="#d3252c" stroke-width="9"/>
      </g>
    </symbol>
  </defs>
</svg>

<!-- Anmeldung -->
<div class="a-login" id="login" hidden>
  <form id="login-form">
    <svg class="k-stander"><use href="#stander"/></svg>
    <h1>Kassenwart-Bereich</h1>
    <p class="k-sub">Getränkekasse · Schwartauer Segler-Verein</p>
    <div class="a-hinweis" id="login-demo" hidden style="margin-top:16px">Demo-Zugang: <strong>kassenwart@demo</strong> · Passwort <strong>demo</strong></div>
    <label class="a-feld" style="margin-top:16px">E-Mail<input type="email" id="login-email" autocomplete="username" required></label>
    <label class="a-feld" style="margin-top:12px">Passwort<input type="password" id="login-pw" autocomplete="current-password" required></label>
    <p class="k-sub fehler" id="login-fehler" style="color:var(--rot);min-height:1.4em"></p>
    <button class="k-btn k-btn-primary k-btn-block" type="submit">Anmelden</button>
    <a href="index.html" class="k-btn k-btn-ghost k-btn-block">Zurück zur Kasse</a>
  </form>
</div>

<!-- Verwaltung -->
<div class="a-shell" id="app" hidden>
  <nav class="a-nav" id="nav">
    <div class="k-brand"><svg class="k-stander"><use href="#stander"/></svg><div><strong>SSV Kasse</strong><span>Kassenwart</span></div></div>
    <button data-tab="uebersicht" class="aktiv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-3H4z"/></svg>Übersicht</button>
    <button data-tab="mitglieder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg>Mitglieder</button>
    <button data-tab="produkte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 2h6M10 2v4.5L7 10v11a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V10l-3-3.5V2M7 14h10"/></svg>Getränke &amp; Preise</button>
    <button data-tab="buchungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Buchungen</button>
    <button data-tab="abrechnung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h9l4 4v16H6zM14 2v5h5M9 12h7M9 16h7"/></svg>Abrechnung</button>
    <button data-tab="einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Einstellungen</button>
    <div class="a-unten">
      <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h4"/></svg>Zur Kasse</a>
      <button id="abmelden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>Abmelden</button>
    </div>
  </nav>
  <main class="a-main" id="main"></main>
</div>

<div id="modal-root"></div>
<div class="k-toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>

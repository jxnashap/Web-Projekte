<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SSV Getränkekasse · Drucken</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="rechnung-seite">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="stander-clip"><path d="M14 8L118 33L14 58Z"/></clipPath>
    <symbol id="stander" viewBox="12 6 108 54">
      <path d="M14 8L118 33L14 58Z" fill="#132a6b"/>
      <g clip-path="url(#stander-clip)">
        <path d="M14 8L70 58M14 58L70 8" stroke="#fff" stroke-width="8"/>
        <path d="M14 8L70 58M14 58L70 8" stroke="#d3252c" stroke-width="4.5"/>
      </g>
    </symbol>
  </defs>
</svg>
<div class="r-leiste">
  <strong id="titel">Drucken</strong>
  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <label id="anhang-wahl" style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" id="anhang" checked> Einzelbuchungen beilegen</label>
    <button class="k-btn k-btn-primary" type="button" data-pdf-sichern style="padding:10px 18px">Als PDF sichern</button>
    <button class="k-btn" type="button" onclick="window.print()" style="padding:10px 18px">Drucken</button>
  </div>
</div>
<div id="blaetter"></div>
<!-- Demo: gemeinsamer Mitgliederstamm mit dem Hafen-Manager („Mein SSV“) -->
<script src="../ssv-hafen/js/daten.js"></script>
<script src="../ssv-hafen/js/gebuehren.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/drucken.js"></script>
<script src="../ssv-hafen/js/pdf.js"></script>
<script>
  // „Als PDF sichern“: echte PDF-Datei (iPad: Teilen → „In Dateien sichern“), „Drucken“ wie bisher
  document.addEventListener('click', (e) => { if (!e.target.closest('[data-pdf-sichern]')) return;
    window.SSV_PDF.sichern(document.querySelectorAll('#blaetter .r-blatt'), { titel: 'SSV ' + document.getElementById('titel').textContent }); });
</script>
</body>
</html>

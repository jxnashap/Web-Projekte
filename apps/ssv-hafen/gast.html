<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1B45">
<title>Gastlieger-Anmeldung · Schwartauer Segler-Verein</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/hafen.css">
<style>
  body { background: var(--navy); }
  .gast { max-width: 520px; margin: 0 auto; padding: 22px 16px 40px; }
  .gast-kopf { color: #fff; text-align: center; padding: 10px 0 18px; }
  .gast-kopf .stander { width: 64px; height: 52px; }
  .gast-kopf h1 { color: #fff; font-size: 28px; margin: 6px 0 4px; }
  .gast-kopf p { margin: 0; color: rgba(255,255,255,.75); }
  .sprache { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
  .sprache button { background: rgba(255,255,255,.1); color: #fff; border: 0; border-radius: 99px; padding: 11px 16px; min-height: 44px; font-size: 14px; cursor: pointer; }
  .sprache button.aktiv { background: #fff; color: var(--navy); }
  .karte { background: #fff; border-radius: 20px; padding: 20px; }
  .karte .feld { margin-bottom: 10px; }
  .preis { text-align: center; font-family: "Playfair Display", serif; font-size: 22px; color: var(--navy); margin: 6px 0 12px; }
  .danke { text-align: center; }
  .danke svg { width: 80px; height: 80px; }
  .gast { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><clipPath id="sc"><path d="M14 8H118L94 33L118 58H14Z"/></clipPath>
  <symbol id="stander" viewBox="0 0 124 100"><rect x="6" y="2" width="5" height="96" rx="2.5" fill="currentColor" opacity=".7"/><path d="M14 8H118L94 33L118 58H14Z" fill="#132a6b"/><g clip-path="url(#sc)"><path d="M14 8L104 58M14 58L104 8" stroke="#fff" stroke-width="15"/><path d="M14 8L104 58M14 58L104 8" stroke="#d3252c" stroke-width="9"/></g><path d="M14 8H118L94 33L118 58H14Z" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2"/></symbol></defs></svg>
<div class="gast">
  <div class="gast-kopf">
    <svg class="stander"><use href="#stander"/></svg>
    <h1 data-t="titel">Moin und willkommen!</h1>
    <p data-t="unter">Schwartauer Segler-Verein · Teerhofinsel, Lübeck</p>
    <div class="sprache"><button data-lang="de" class="aktiv" aria-pressed="true">Deutsch</button><button data-lang="en" aria-pressed="false">English</button><button data-lang="da" aria-pressed="false">Dansk</button></div>
  </div>
  <div class="karte" id="karte">
    <p class="preis" id="preis"></p>
    <p class="hinweis" data-t="info">Grüne Schilder am Steg zeigen freie Plätze. Melde dich kurz an – der Hafenmeister bestätigt dir deinen Platz.</p>
    <form id="f">
      <label class="feld"><span data-t="boot">Bootsname</span><input name="bootsname" required autocomplete="off"></label>
      <label class="feld"><span data-t="skipper">Skipper</span><input name="skipper" required autocomplete="name"></label>
      <label class="feld"><span data-t="hafen">Heimathafen</span><input name="herkunft"></label>
      <label class="feld"><span data-t="tel">Telefon (für Rückfragen)</span><input name="tel" type="tel" autocomplete="tel"></label>
      <div class="form"><label class="feld"><span data-t="laenge">Länge (m)</span><input name="laenge" type="number" step="0.1" min="2" max="20" required inputmode="decimal"></label>
      <label class="feld"><span data-t="breite">Breite (m)</span><input name="breite" type="number" step="0.1" min="1" max="6" inputmode="decimal"></label>
      <label class="feld"><span data-t="tiefgang">Tiefgang (m)</span><input name="tiefgang" type="number" step="0.1" min="0.2" max="4" inputmode="decimal"></label>
      <label class="feld"><span data-t="ankunft">Ankunft</span><input name="ankunft" type="date" required></label>
      <label class="feld"><span data-t="naechte">Nächte</span><input name="naechte" type="number" min="1" max="30" value="1" required></label></div>
      <p class="hinweis fehler" id="gast-fehler" role="alert" hidden></p>
      <button class="btn primaer" style="width:100%;margin-top:8px;padding:14px" data-t="senden">Anmelden</button>
    </form>
  </div>
  <p style="color:rgba(255,255,255,.6);text-align:center;font-size:12px;margin-top:16px" data-t="ds">Deine Angaben nutzen wir nur für die Liegeplatzvergabe und Abrechnung.</p>
  <p style="text-align:center;font-size:12px;margin-top:6px"><a style="color:#fff" href="../website/datenschutz.html#gaeste">Datenschutz / Privacy</a> · <a style="color:#fff" href="../website/impressum.html">Impressum</a></p>
</div>
<div class="toast" id="toast"></div>
<script src="js/config.js"></script>
<script src="js/sb.js"></script>
<script src="js/daten.js"></script>
<script src="js/gebuehren.js"></script>
<script>
(function () {
  'use strict';
  // Vereinsdatenbank: Preis und Hafenmeister kommen über eine öffentliche Funktion, die Anmeldung legt genau einen Eintrag an
  const HF = window.HAFEN, SB = window.SSV_SB, H = HF.H;
  const d = SB ? null : HF.laden();
  let e = d ? d.einstellungen : { hafenmeister_name: 'Hafenmeister', hafenmeister_tel: '' };
  let gb = d ? window.HAFEN_GEBUEHREN.gebuehrenFuer(d, new Date().getFullYear()) : { gast_nacht: 15 };
  if (SB) SB.rpc('gast_info', {}, true).then((i) => { gb = { gast_nacht: Number(i.gast_nacht) }; e = { hafenmeister_name: i.hafenmeister_name || 'Hafenmeister', hafenmeister_tel: i.hafenmeister_tel || '' }; setze(); }).catch(() => {});
  const T = {
    de: { titel: 'Moin und willkommen!', unter: 'Schwartauer Segler-Verein · Teerhofinsel, Lübeck', info: 'Grüne Schilder am Steg zeigen freie Plätze. Melde dich kurz an – der Hafenmeister bestätigt dir deinen Platz.', boot: 'Bootsname', skipper: 'Skipper', hafen: 'Heimathafen', tel: 'Telefon (für Rückfragen)', laenge: 'Länge (m)', breite: 'Breite (m)', tiefgang: 'Tiefgang (m)', ankunft: 'Ankunft', naechte: 'Nächte', senden: 'Anmelden', ds: 'Verantwortlich: Schwartauer Segler-Verein e.V. Deine Angaben nutzen wir nur für Liegeplatz und Abrechnung; Kontaktdaten löschen wir 12 Monate nach der Abreise.', fehler: 'Das hat nicht geklappt – bitte noch einmal versuchen oder den Hafenmeister anrufen.', summe: 'Deine Anmeldung', nacht: 'pro Nacht', danke: 'Danke, du bist angemeldet!', danke2: 'Der Hafenmeister weist dir gleich deinen Platz zu und kassiert die Liegegebühr. Fragen?' },
    en: { titel: 'Welcome aboard!', unter: 'Schwartauer Segler-Verein · Teerhofinsel, Lübeck', info: 'Green signs on the jetty mark free berths. Please register – the harbour master will confirm your berth.', boot: 'Boat name', skipper: 'Skipper', hafen: 'Home port', tel: 'Phone', laenge: 'Length (m)', breite: 'Beam (m)', tiefgang: 'Draught (m)', ankunft: 'Arrival', naechte: 'Nights', senden: 'Register', ds: 'Controller: Schwartauer Segler-Verein e.V. We only use your details for your berth and billing and delete contact details 12 months after departure.', fehler: 'That did not work – please try again or call the harbour master.', summe: 'Your registration', nacht: 'per night', danke: 'Thank you, you are registered!', danke2: 'The harbour master will assign your berth and collect the fee. Questions?' },
    da: { titel: 'Velkommen!', unter: 'Schwartauer Segler-Verein · Teerhofinsel, Lübeck', info: 'Grønne skilte på broen = ledig plads. Tilmeld dig – havnefogeden bekræfter din plads.', boot: 'Bådens navn', skipper: 'Skipper', hafen: 'Hjemhavn', tel: 'Telefon', laenge: 'Længde (m)', breite: 'Bredde (m)', tiefgang: 'Dybgang (m)', ankunft: 'Ankomst', naechte: 'Nætter', senden: 'Tilmeld', ds: 'Dataansvarlig: Schwartauer Segler-Verein e.V. Vi bruger kun dine oplysninger til plads og afregning og sletter kontaktdata 12 måneder efter afrejse.', fehler: 'Det lykkedes ikke – prøv igen eller ring til havnefogeden.', summe: 'Din tilmelding', nacht: 'pr. nat', danke: 'Tak, du er tilmeldt!', danke2: 'Havnefogeden tildeler dig en plads og opkræver havnepengene. Spørgsmål?' }
  };
  // Sprache des Handys übernehmen (dänische und andere Gäste sehen nicht zuerst Deutsch)
  const nl = (navigator.language || 'de').slice(0, 2); let lang = nl === 'de' ? 'de' : nl === 'da' ? 'da' : 'en';
  document.querySelectorAll('[data-lang]').forEach((x) => { x.classList.toggle('aktiv', x.dataset.lang === lang); x.setAttribute('aria-pressed', String(x.dataset.lang === lang)); });
  const telLink = (t) => { t = String(t || '').replace(/[^\d+]/g, ''); return t.startsWith('0') ? '+49' + t.slice(1) : t; };   // international wählbar
  const setze = () => { document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T[lang][el.dataset.t]; }); document.getElementById('preis').textContent = H.geld(gb.gast_nacht) + ' ' + T[lang].nacht; document.documentElement.lang = lang; };
  document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; document.querySelectorAll('[data-lang]').forEach((x) => { x.classList.toggle('aktiv', x === b); x.setAttribute('aria-pressed', String(x === b)); }); setze(); }));
  const f = document.getElementById('f'); f.ankunft.value = H.tag(new Date()); setze();
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault(); const x = Object.fromEntries(new FormData(f));
    const n = Math.max(1, Number(x.naechte) || 1);
    if (SB) {
      const knopf = f.querySelector('button'); knopf.disabled = true;
      try { await SB.rpc('gast_anmelden', { p: { bootsname: x.bootsname, skipper: x.skipper, herkunft: x.herkunft, tel: x.tel, laenge: x.laenge, breite: x.breite, tiefgang: x.tiefgang, ankunft: x.ankunft, naechte: n } }, true); }
      catch (err) { knopf.disabled = false; const fe = document.getElementById('gast-fehler'); fe.textContent = T[lang].fehler + ' (' + err.message + ')'; fe.hidden = false; return; }
    } else d.gaeste.push({ id: H.uid('G'), bootsname: x.bootsname.trim(), skipper: x.skipper.trim(), herkunft: x.herkunft.trim(), tel: x.tel.trim(), email: '', laenge: Number(x.laenge), breite: Number(x.breite) || 0, tiefgang: Number(x.tiefgang) || null,
      ankunft: x.ankunft, naechte: n, platz_id: '', betrag: n * gb.gast_nacht, zahlung: 'offen', bezahlt_am: '', quittung_nr: '', status: 'angemeldet', quelle: 'qr', erstellt: new Date().toISOString() });
    if (!SB) HF.sichern();
    document.getElementById('karte').innerHTML = '<div class="danke"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="36" fill="rgba(29,138,90,.1)" stroke="#1d8a5a" stroke-width="4"/><path d="M24 41l11 11 22-24" fill="none" stroke="#1d8a5a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '<h2 style="margin:10px 0 6px">' + T[lang].danke + '</h2><p><strong>' + T[lang].summe + ':</strong> „' + H.esc(x.bootsname) + '“ · ' + n + ' × ' + H.geld(gb.gast_nacht) + ' = <strong>' + H.geld(n * gb.gast_nacht) + '</strong></p><p>' + T[lang].danke2 + '</p><p><strong>' + H.esc(e.hafenmeister_name) + '</strong> · <a href="tel:' + H.esc(telLink(e.hafenmeister_tel)) + '">' + H.esc(e.hafenmeister_tel) + '</a></p></div>';
  });
})();
</script>
</body>
</html>

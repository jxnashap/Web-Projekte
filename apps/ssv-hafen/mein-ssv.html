<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1B45">
<title>Mein SSV · Schwartauer Segler-Verein</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/hafen.css">
<style>
  .mein-kopf { background: var(--navy); color: #fff; padding: 18px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .mein-kopf h1 { color: #fff; font-size: 24px; } .mein-kopf p { margin: 2px 0 0; opacity: .7; font-size: 13px; }
  .mein-kopf select { margin-left: auto; padding: 8px 10px; border-radius: 9px; border: 0; max-width: 100%; color: var(--ink); background: #fff; }
  .mein { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .mein-raster { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; align-items: start; }
  .gruen-box { border: 2px solid var(--gruen); }
  .kasse-zahlen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 12px; }
  .kasse-zahlen div { background: var(--sand, #f5f1e8); border-radius: 12px; padding: 10px 12px; }
  .kasse-zahlen small { display: block; color: var(--muted); font-size: 12px; }
  .kasse-zahlen strong { font-size: 20px; color: var(--navy); }
  .code-feld { font-size: 26px; letter-spacing: .3em; text-align: center; font-variant-numeric: tabular-nums; }
  .mein-raster > div { min-width: 0; }
  .detail dd { overflow-wrap: anywhere; }
  .mini-plan { margin-top: 12px; border-radius: 12px; overflow: hidden; }
  /* Auf einen Blick */
  .blick { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 12px; margin: 0 0 16px; }
  .blick button { text-align: left; background: #fff; border: 0; border-radius: 14px; box-shadow: var(--schatten); padding: 12px 14px; cursor: pointer; font: inherit; color: inherit; min-width: 0; }
  .blick small { display: block; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-2); font-weight: 700; }
  .blick strong { display: block; font-size: 19px; color: var(--navy); margin: 3px 0 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blick span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Aufklappbare Bereiche */
  details.sek > summary { list-style: none; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  details.sek > summary::-webkit-details-marker { display: none; }
  details.sek > summary h2 { margin: 0; }
  details.sek > summary::after { content: ''; flex: none; width: 8px; height: 8px; border-right: 2px solid var(--muted-2); border-bottom: 2px solid var(--muted-2); transform: rotate(45deg); margin: -4px 2px 0 0; transition: transform .2s; }
  details.sek[open] > summary::after { transform: rotate(-135deg); margin-top: 4px; }
  .sek-info { margin-left: auto; font-size: 13px; color: var(--muted); text-align: right; }
  .sek-inhalt { margin-top: 14px; }
  .panel.sek { display: block; width: 100%; box-sizing: border-box; }
  .login-karte { max-width: 440px; margin: 30px auto; }
  .login-links { margin: 14px 0 0; font-size: 14px; }
  .login-links a { color: var(--navy); }
  .mein-fuss { text-align: center; font-size: 13px; color: var(--muted); padding: 0 16px 40px; } .mein-fuss a { color: var(--navy); display: inline-block; padding: 10px 4px; }
  table.rechn td { vertical-align: middle; }
  @media (max-width: 860px) {
    .mein-kopf { padding: 12px 16px; gap: 10px; }
    .mein-kopf h1 { font-size: 20px; } .mein-kopf .stander { width: 36px; height: 30px; }
    .mein-kopf select { margin-left: 0; width: 100%; }
    .mein { padding: 12px 12px 48px; }
    .mein .kopf { margin-bottom: 12px; } .mein .kopf h1 { font-size: 25px; }
    .mein-raster { display: flex; flex-direction: column; gap: 0; }
    .mein-raster > div { display: contents; }
    .sek[data-sek=rechnungen] { order: 1; } .sek[data-sek=schild] { order: 2; } .sek[data-sek=kasse] { order: 3; } .sek[data-sek=boot] { order: 4; } .sek[data-sek=warteliste] { order: 5; } .sek[data-sek=daten] { order: 6; }
    .panel.sek { padding: 14px 16px; margin-bottom: 10px; }
    .panel.sek h2 { font-size: 17px; }
    .blick { gap: 8px; margin-bottom: 12px; }
    .blick button { padding: 10px 11px; }
    .blick strong { font-size: 16px; }
    .sek-info { font-size: 12.5px; }
    .demo-band { font-size: 12px; padding: 7px 10px; margin-bottom: 10px; }
  }
  @media (max-width: 860px) { .mein-raster { grid-template-columns: 1fr; } }
  .mein { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><clipPath id="sc"><path d="M14 8L118 33L14 58Z"/></clipPath>
  <symbol id="stander" viewBox="12 6 108 54"><path d="M14 8L118 33L14 58Z" fill="#132a6b"/><g clip-path="url(#sc)"><path d="M14 8L70 58M14 58L70 8" stroke="#fff" stroke-width="8"/><path d="M14 8L70 58M14 58L70 8" stroke="#d3252c" stroke-width="4.5"/></g><path d="M14 8L118 33L14 58Z" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2"/></symbol></defs></svg>
<header class="mein-kopf">
  <svg class="stander"><use href="#stander"/></svg>
  <div><h1>Mein SSV</h1><p>Mitgliederbereich · Demo</p></div>
  <select id="wer" aria-label="Als Mitglied ansehen (Demo)"></select>
</header>
<main class="mein" id="main"></main>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script src="js/config.js"></script>
<script src="js/sb.js"></script>
<script src="js/daten.js"></script>
<script src="js/gebuehren.js"></script>
<script src="js/plan.js"></script>
<!-- Getränkekasse: Buchungen, Rechnungen und Code (Demo: gleicher Browser-Speicher wie die Kasse) -->
<script src="../ssv-getraenke/js/config.js"></script>
<script src="../ssv-getraenke/js/store.js"></script>
<script src="js/mein-start.js"></script>
</body>
</html>

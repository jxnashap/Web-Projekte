<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1B45">
<title>Mein SSV · Schwartauer Segler-Verein</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="mein.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mein SSV">
<link rel="stylesheet" href="css/hafen.css">
<style>
  .mein-kopf { background: var(--navy); color: #fff; padding: 18px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .mein-kopf h1 { color: #fff; font-size: 24px; } .mein-kopf p { margin: 2px 0 0; opacity: .8; font-size: 14.5px; }
  .mein-kopf select { margin-left: auto; padding: 8px 10px; min-height: 42px; font-size: 16px; border-radius: 9px; border: 0; max-width: 100%; color: var(--ink); background: #fff; }
  .mein { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .mein-raster { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; align-items: start; }
  .gruen-box { border: 2px solid var(--gruen); }
  .mein-bereich { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 0 8px; font-size: 15px; }
  .mein-bereich p { margin: 4px 0; } .mein-bereich ul { margin: 6px 0 0; padding-left: 18px; } .mein-bereich li { margin: 2px 0; } .mein-bereich small { color: var(--muted); }
  .mein-bereich-kopf strong { font-size: 16px; color: var(--navy); }
  /* Arbeitsgruppen als Zeile „Krancrew · 14 offene Aufgaben ▸“ – Aufgaben klappen auf */
  .mb-titel { margin: 16px 0 8px; font-size: 16px; }
  .mein-bereich > details > summary { list-style: none; cursor: pointer; min-height: 40px; display: block; padding: 8px 22px 8px 0; position: relative; line-height: 1.45; }
  .mein-bereich > details > summary::-webkit-details-marker { display: none; }
  .mein-bereich > details > summary strong { font-size: 16px; color: var(--navy); }
  .mein-bereich > details > summary::after { content: '▸'; position: absolute; right: 2px; top: calc(50% - .75em); color: var(--muted); transition: transform .2s; }
  .mein-bereich > details[open] > summary::after { transform: rotate(90deg); }
  .mb-zahl { color: var(--muted); } .mb-kontakt { margin: 6px 0 2px !important; }
  .ad-kurz { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; }
  .ad-kurz p { margin: 0; font-size: 16px; } .ad-kurz strong { color: var(--navy); font-size: 18px; }
  .ad-notiz { margin: 8px 0 0; font-size: 14.5px; color: var(--muted); }
  details.mein-mehr { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 6px; }
  details.mein-mehr > summary { list-style: none; cursor: pointer; font-weight: 600; color: var(--navy); min-height: 40px; display: flex; align-items: center; gap: 8px; }
  details.mein-mehr > summary::-webkit-details-marker { display: none; }
  details.mein-mehr > summary::after { content: '▸'; margin-left: auto; color: var(--muted); transition: transform .2s; } details.mein-mehr[open] > summary::after { transform: rotate(90deg); }
  .mein .detail dd .tag { border-radius: 10px; }
  .mein-suche { background: #fff; border-radius: 16px; box-shadow: var(--schatten); padding: 14px 16px; margin: 0 0 14px; }
  .mein-suche > label { display: block; font-family: 'Playfair Display', Georgia, serif; font-size: 19px; color: var(--navy); margin: 0 0 8px; }
  .mein-such-erg { margin-top: 6px; } .mein-such-erg:empty { display: none; }
  .mein-schnell { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { border: 1px solid var(--line); background: #f6f4ee; color: var(--navy); border-radius: 99px; padding: 8px 14px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; min-height: 40px; }
  .chip:hover { border-color: var(--navy-3); }
  .mein-frage { border-top: 1px solid var(--line); padding: 10px 12px; } .mein-frage summary { cursor: pointer; font-weight: 600; color: var(--navy); } .mein-frage p { margin: 8px 0 0; }
  .schrift-m { margin-left: auto; background: rgba(255,255,255,.14) !important; color: #fff !important; box-shadow: none !important; }
  #wer + .schrift-m { margin-left: 0; }
  html.schrift-gross .chip { font-size: 16.5px; } html.schrift-gross .mein-suche > label { font-size: 21px; }
  .ver-karte { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
  .ver-karte:first-child { border-top: 0; padding-top: 2px; }
  .ver-karte[hidden] { display: none; }
  .ver-liste:not(.alle) .ver-karte.ver-fest { border-top: 0; padding-top: 2px; } .ver-liste:not(.alle) .ver-karte.ver-fest ~ .ver-karte.ver-fest { border-top: 1px solid var(--line); padding-top: 14px; }
  .ver-text { min-width: 0; overflow-wrap: break-word; } .ver-text h3 { hyphens: auto; -webkit-hyphens: auto; } .ver-text .tag { white-space: normal; border-radius: 10px; }
  .ver-weitere { margin-top: 4px; white-space: normal; text-align: left; max-width: 100%; height: auto; }
  #rmehr { white-space: normal; text-align: left; max-width: 100%; height: auto; }
  .ver-datum { display: flex; flex-direction: column; align-items: center; justify-content: center; align-self: start; padding: 6px 0; border-radius: 10px; background: #E7EEF3; color: var(--navy); line-height: 1.1; }
  .ver-datum strong { font-size: 22px; } .ver-datum small { font-size: 13px; letter-spacing: 0; color: var(--muted); }
  .ver-text h3 { margin: 0; font-size: 17px; color: var(--navy); } .ver-text p { margin: 6px 0 0; font-size: 15px; }
  .ver-text .ver-zeit { margin-top: 2px; color: var(--muted); font-size: 14.5px; } .ver-stand small { color: var(--muted); }
  .ver-fakten { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 14.5px !important; }
  .ver-text .aktionen { margin-top: 10px; } .ver-klein { color: var(--muted); font-size: 14px !important; }
  .ver-karte.abgesagt h3 { text-decoration: line-through; color: var(--muted); }
  .kasse-zahlen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 12px; }
  .kasse-zahlen div { background: var(--sand, #f5f1e8); border-radius: 12px; padding: 10px 12px; }
  .kasse-zahlen small { display: block; color: var(--muted); font-size: 14px; }
  .kasse-zahlen strong { font-size: 20px; color: var(--navy); }
  .code-feld { font-size: 26px; letter-spacing: .3em; text-align: center; font-variant-numeric: tabular-nums; }
  .mein-raster > div { min-width: 0; }
  .detail dd { overflow-wrap: anywhere; }
  .mini-plan { margin-top: 12px; border-radius: 12px; overflow: hidden; }
  /* Auf einen Blick */
  .blick { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 12px; margin: 0 0 16px; }
  .blick button { text-align: left; background: #fff; border: 0; border-radius: 14px; box-shadow: var(--schatten); padding: 12px 14px; cursor: pointer; font: inherit; color: inherit; min-width: 0; }
  .blick small { display: block; font-size: 14px; letter-spacing: 0; color: var(--muted); font-weight: 700; }
  .blick strong { display: block; font-size: 19px; color: var(--navy); margin: 3px 0 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blick span { display: block; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Aufklappbare Bereiche */
  details.sek > summary { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; cursor: pointer; min-height: 44px; position: relative; padding-right: 22px; }
  details.sek > summary::-webkit-details-marker { display: none; }
  details.sek > summary h2 { margin: 0; flex: none; white-space: nowrap; }
  details.sek > summary::after { content: ''; position: absolute; right: 2px; top: calc(50% - 6px); width: 8px; height: 8px; border-right: 2px solid var(--muted-2); border-bottom: 2px solid var(--muted-2); transform: rotate(45deg); transition: transform .2s; }
  details.sek[open] > summary::after { transform: rotate(-135deg); top: calc(50% - 2px); }
  /* Zusammenfassung: eine Zeile neben dem Titel, zu lange Texte enden mit „…“ (ganzer Text im Tooltip).
     Ein Schild (.mit-schild, z. B. „3 Einladungen offen“) wird nie gekürzt – passt es nicht daneben, steht es in der Zeile darunter. */
  .sek-info { flex: 1 1 0; margin-left: auto; min-width: 0; font-size: 14px; color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sek-info.mit-schild { flex: 0 1 auto; overflow: visible; max-width: 100%; }
  .sek-info .tag { white-space: normal; }
  .sek-inhalt { margin-top: 14px; }
  .panel.sek { display: block; width: 100%; box-sizing: border-box; }
  .login-karte { max-width: 440px; margin: 30px auto; }
  .login-links { margin: 14px 0 0; font-size: 14px; }
  .login-links a { color: var(--navy); }
  .mein-fuss { text-align: center; font-size: 14px; color: var(--muted); padding: 0 16px 40px; } .mein-fuss a { color: var(--navy); display: inline-block; padding: 10px 4px; }
  table.rechn td { vertical-align: middle; }
  .mitteilung { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; background: #fff; border-left: 4px solid var(--navy); border-radius: 12px; padding: 12px 14px; margin: 0 0 12px; box-shadow: var(--schatten); }
  .mitteilung.wichtig { border-left-color: var(--rot); background: #fff5f5; }
  .mitteilung p { margin: 4px 0; font-size: 15px; } .mitteilung small { color: var(--muted); font-size: 14px; } .mitteilung .btn { flex: none; }
  @media (max-width: 860px) { .mein { padding-bottom: 96px; } }
  .erkl { display: inline-block; font-size: 14px; margin-top: 3px; color: var(--muted); } .erkl.warn { color: #8a5e05; font-weight: 600; } .erkl.rot { color: var(--rot); font-weight: 600; }
  .blick { grid-template-columns: 1.3fr 1fr 1fr; }
  #k-offen span { white-space: normal; }
  @media (max-width: 600px) {
    .blick { grid-template-columns: 1fr 1fr; }
    .blick button:first-child { grid-column: 1 / -1; }
    .blick button:nth-child(2):last-child { grid-column: 1 / -1; }
    .blick span { white-space: normal; }
  }
  @media (max-width: 860px) {
    .mein-kopf { padding: 12px 16px; gap: 10px; }
    .mein-kopf h1 { font-size: 20px; } .mein-kopf .stander { width: 44px; height: 22px; }
    .mein-kopf select { margin-left: 0; width: 100%; }
    .mein { padding: 12px 12px 48px; }
    .mein .kopf { margin-bottom: 12px; } .mein .kopf h1 { font-size: 25px; }
    .mein-raster { display: flex; flex-direction: column; gap: 0; }
    .mein-raster > div { display: contents; }
    .sek[data-sek=rechnungen] { order: 1; } .sek[data-sek=schild] { order: 2; } .sek[data-sek=veranstaltungen] { order: 3; } .sek[data-sek=kasse] { order: 3; } .sek[data-sek=termine] { order: 4; } .sek[data-sek=boot] { order: 5; }
    .sek[data-sek=arbeitsdienst] { order: 6; } .sek[data-sek=warteliste] { order: 7; } .sek[data-sek=daten] { order: 8; } .sek[data-sek=schaden] { order: 9; }
    .panel.sek { padding: 14px 16px; margin-bottom: 10px; }
    .panel.sek h2 { font-size: 17px; }
    .blick { gap: 8px; margin-bottom: 12px; }
    .blick button { padding: 10px 11px; }
    .blick strong { font-size: 16px; }
    .sek-info { font-size: 13.5px; }
    .demo-band { font-size: 14px; padding: 7px 10px; margin-bottom: 10px; }
  }
  @media (max-width: 860px) { .mein-raster { grid-template-columns: 1fr; } }
  /* Schmale Handys: Passt die Kurzinfo nicht neben die Überschrift, rutscht sie ganz in eine zweite Zeile darunter (einzeilig, notfalls mit „…“). */
  @media (max-width: 480px) {
    .sek-info { flex: 0 1 auto; max-width: 100%; }
  }
  /* Lesbarkeit (Zielgruppe 50+): Tabellen, Schilder, kleine Knöpfe und Felder hier mindestens wie in der Getränkekasse */
  @media screen {
    .mein .tab td { font-size: 15.5px; } .mein .tab small { font-size: 14px; }
    .mein .tag { font-size: 14px; } .mein .btn.klein, .mein-kopf .btn.klein, .modal .btn.klein { min-height: 40px; }
    .modal .feld, .mein .feld { font-size: 15px; } .feld .feld-fehler { display: block; color: var(--rot); font-size: 14.5px; font-weight: 600; line-height: 1.35; margin-top: 2px; }
    .feld input[aria-invalid=true] { border-color: var(--rot); box-shadow: 0 0 0 2px rgba(200,30,40,.15); }
  }
  .mein { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><clipPath id="sc"><path d="M14 8L118 33L14 58Z"/></clipPath>
  <symbol id="stander" viewBox="12 6 108 54"><path d="M14 8L118 33L14 58Z" fill="#132a6b"/><g clip-path="url(#sc)"><path d="M14 8L70 58M14 58L70 8" stroke="#fff" stroke-width="8"/><path d="M14 8L70 58M14 58L70 8" stroke="#d3252c" stroke-width="4.5"/></g><path d="M14 8L118 33L14 58Z" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2"/></symbol></defs></svg>
<header class="mein-kopf">
  <svg class="stander"><use href="#stander"/></svg>
  <div><h1>Mein SSV</h1><p>Mitgliederbereich · Demo</p></div>
  <select id="wer" aria-label="Als Mitglied ansehen (Demo)"></select>
</header>
<main class="mein" id="main"></main>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script src="js/config.js"></script>
<script src="js/sb.js"></script>
<script src="js/bereiche-vorlage.js"></script>
<script src="js/daten.js"></script>
<script src="js/gebuehren.js"></script>
<script src="js/plan.js"></script>
<!-- Getränkekasse: Buchungen, Rechnungen und Code (Demo: gleicher Browser-Speicher wie die Kasse) -->
<script src="../ssv-getraenke/js/config.js"></script>
<script src="../ssv-getraenke/js/store.js"></script>
<script src="js/mein-start.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1B45">
<title>SSV Hafen-Manager</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/hafen.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="sc"><path d="M14 8L118 33L14 58Z"/></clipPath>
    <symbol id="stander" viewBox="12 6 108 54">
      <path d="M14 8L118 33L14 58Z" fill="#132a6b"/>
      <g clip-path="url(#sc)"><path d="M14 8L104 58M14 58L104 8" stroke="#fff" stroke-width="15"/><path d="M14 8L104 58M14 58L104 8" stroke="#d3252c" stroke-width="9"/></g>
      <path d="M14 8L118 33L14 58Z" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2"/>
    </symbol>
  </defs>
</svg>

<a class="skip" href="#main">Zum Inhalt springen</a>
<div class="login" id="login" hidden>
  <div class="karte-login">
    <svg class="stander" style="color:#0E1B45"><use href="#stander"/></svg>
    <h1>Hafen-Manager</h1>
    <p style="color:var(--muted);margin:0">Schwartauer Segler-Verein e.V. · Demo</p>
    <p class="hinweis" style="margin-top:14px">In der Demo meldest du dich mit einer Rolle an. Im Echtbetrieb hat jede Person ein eigenes Konto, und die Rolle legt fest, was sie sieht.</p>
    <div class="rollen" id="rollen">
      <button data-rolle="vorstand"><strong>Vorstand</strong><span>alles sehen und bearbeiten</span></button>
      <button data-rolle="brueckenwart"><strong>Brückenwartin</strong><span>Belegung, Boote, Warteliste, Ein-/Auslagern</span></button>
      <button data-rolle="hafenmeister"><strong>Hafenmeister</strong><span>Hafenplan, Gastlieger, Abwesenheiten, Kran</span></button>
      <button data-rolle="kassenwart"><strong>Kassenwart</strong><span>Abrechnung, Lastschrift, Gebühren, Bankdaten</span></button>
    </div>
    <p style="margin:16px 0 0;font-size:13px"><a href="mein-ssv.html">Zum Mitgliederbereich „Mein SSV“ →</a></p>
  </div>
</div>

<div class="shell" id="app" hidden>
  <nav class="nav" id="nav" aria-label="Bereiche"></nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/sb.js"></script>
<script src="js/daten.js"></script>
<script src="js/gebuehren.js"></script>
<script src="js/sepa.js"></script>
<script src="js/plan.js"></script>
<script src="js/start.js"></script>
</body>
</html>

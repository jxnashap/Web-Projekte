<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1B45">
<title>Redaktion · Schwartauer Segler-Verein</title>
<link rel="icon" href="../bilder/stander.svg" type="image/svg+xml">
<link rel="stylesheet" href="redaktion.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="sc"><path d="M14 8H118L94 33L118 58H14Z"/></clipPath>
    <symbol id="stander" viewBox="0 0 124 100">
      <rect x="6" y="2" width="5" height="96" rx="2.5" fill="currentColor" opacity=".6"/>
      <path d="M14 8H118L94 33L118 58H14Z" fill="#132a6b"/>
      <g clip-path="url(#sc)"><path d="M14 8L104 58M14 58L104 8" stroke="#fff" stroke-width="15"/><path d="M14 8L104 58M14 58L104 8" stroke="#d3252c" stroke-width="9"/></g>
      <path d="M14 8H118L94 33L118 58H14Z" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
    </symbol>
  </defs>
</svg>

<div class="login" id="login" hidden>
  <form id="login-form">
    <svg class="stander"><use href="#stander"/></svg>
    <h1>Redaktion</h1>
    <p class="sub">Website des Schwartauer Segler-Vereins</p>
    <p class="hinweis" id="login-demo" hidden>Demo-Zugang: <strong>redaktion@demo</strong> · Passwort <strong>demo</strong></p>
    <label class="feld">E-Mail<input type="email" id="login-email" autocomplete="username" required></label>
    <label class="feld">Passwort<input type="password" id="login-pw" autocomplete="current-password" required></label>
    <p class="fehler" id="login-fehler"></p>
    <button class="btn primaer breit" type="submit">Anmelden</button>
    <a class="btn breit" href="../index.html">Zur Website</a>
  </form>
</div>

<div class="shell" id="app" hidden>
  <nav class="nav" id="nav" aria-label="Bereiche">
    <div class="marke"><svg class="stander"><use href="#stander"/></svg><div><strong>SSV Redaktion</strong><span>Website pflegen</span></div></div>
    <button data-tab="start" class="aktiv">Übersicht</button>
    <button data-tab="hinweis">Hinweis-Banner</button>
    <button data-tab="aktuelles">Aktuelles</button>
    <button data-tab="termine">Termine</button>
    <button data-tab="zeiten">Zeiten &amp; Preise</button>
    <button data-tab="galerie">Fotos</button>
    <button data-tab="hero">Startbild</button>
    <button data-tab="vorstand">Vorstand</button>
    <button data-tab="zahlen">Zahlen</button>
    <div class="nav-unten">
      <a href="../index.html" target="_blank" rel="noopener">Website ansehen ↗</a>
      <button id="abmelden">Abmelden</button>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>

<div id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>window.SSV_CMS_KEIN_AUTOSTART = true;</script>
<script src="../js/konfig.js"></script>
<script src="../js/inhalte-standard.js"></script>
<script src="../js/cms.js"></script>
<script src="redaktion.js"></script>
</body>
</html>

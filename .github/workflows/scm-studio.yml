# Prüft SCM Studio bei Änderungen: Typen, Lint, Produktions-Build.
name: SCM Studio prüfen

on:
  push:
    paths: ["apps/scm-studio/**", ".github/workflows/scm-studio.yml"]
  pull_request:
    paths: ["apps/scm-studio/**", ".github/workflows/scm-studio.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scm-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/scm-studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

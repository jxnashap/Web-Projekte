name: fetch-assets

# Hilfs-Workflow: laedt extern generierte Medien (Higgsfield-CDN) in das Repo,
# da die Build-Umgebung keinen direkten Zugriff auf das CDN hat.
on:
  workflow_dispatch: {}
  push:
    branches:
      - "claude/**"
    paths:
      - "assets-manifest.json"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download assets from manifest
        run: |
          test -f assets-manifest.json || { echo "no manifest"; exit 0; }
          jq -c '.[]' assets-manifest.json | while read -r item; do
            url=$(echo "$item" | jq -r '.url')
            path=$(echo "$item" | jq -r '.path')
            mkdir -p "$(dirname "$path")"
            curl -sSLk --retry 3 --retry-delay 2 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" -o "$path" "$url"
            echo "fetched: $path ($(stat -c%s "$path") bytes)"
          done

      - name: Redact secrets from fetched text files
        run: |
          # Verhindert Push-Protection-Blocks: Tokens in gescannten Seiten schwaerzen
          find .preview-cache -type f \( -name "*.html" -o -name "*.md" -o -name "*.json" -o -name "*.css" -o -name "*.js" \) 2>/dev/null | while read -r f; do
            sed -i -E 's/(sk|pk)\.eyJ[A-Za-z0-9._-]+/REDACTED_TOKEN/g; s/AIza[0-9A-Za-z_-]{35}/REDACTED_TOKEN/g; s/gh[pousr]_[A-Za-z0-9]{30,}/REDACTED_TOKEN/g' "$f" || true
          done

      - name: Commit fetched assets
        run: |
          git config user.name "asset-fetcher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add fetched media assets" || echo "nothing to commit"
          git push

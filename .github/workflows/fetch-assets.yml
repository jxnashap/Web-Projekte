name: fetch-assets

# Hilfs-Workflow: laedt extern generierte Medien (Higgsfield-CDN) in das Repo,
# da die Build-Umgebung keinen direkten Zugriff auf das CDN hat.
on:
  workflow_dispatch: {}
  push:
    branches:
      - "claude/**"
    paths:
      - "assets-manifest.json"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download assets from manifest
        run: |
          test -f assets-manifest.json || { echo "no manifest"; exit 0; }
          jq -c '.[]' assets-manifest.json | while read -r item; do
            url=$(echo "$item" | jq -r '.url')
            path=$(echo "$item" | jq -r '.path')
            mkdir -p "$(dirname "$path")"
            headers=$(echo "$item" | jq -r '.headers // empty')
            mode=$(echo "$item" | jq -r '.mode // empty')
            if [ "$mode" = "transcribe" ]; then
              src=$(echo "$item" | jq -r '.src')
              python3 -c "import faster_whisper, imageio_ffmpeg" 2>/dev/null || pip install -q faster-whisper imageio-ffmpeg
              python3 - "$src" "$path" <<'PY' || echo "transcribe failed: $src"
          import subprocess, sys
          import imageio_ffmpeg
          import numpy as np
          from faster_whisper import WhisperModel
          src, out = sys.argv[1], sys.argv[2]
          raw = subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), "-nostdin", "-loglevel", "error", "-i", src,
                                "-f", "s16le", "-ac", "1", "-ar", "16000", "-"],
                               check=True, capture_output=True).stdout
          audio = np.frombuffer(raw, np.int16).astype(np.float32) / 32768.0
          model = WhisperModel("small", device="cpu", compute_type="int8")
          segs, info = model.transcribe(audio, language="de", vad_filter=True)
          with open(out, "w", encoding="utf-8") as f:
              for s in segs:
                  f.write(f"[{s.start:5.1f}-{s.end:5.1f}] {s.text.strip()}\n")
          PY
            elif [ "$mode" = "ytdlp" ]; then
              command -v yt-dlp >/dev/null || pip install -q yt-dlp
              yt-dlp -q --no-warnings --write-info-json -f "best[ext=mp4]/best" -o "$path" "$url" || echo "yt-dlp failed: $url"
            elif [ -n "$headers" ]; then
              curl -sSLk --retry 3 --retry-delay 2 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" -H "$headers" -o "$path" "$url"
            else
              curl -sSLk --retry 3 --retry-delay 2 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" -o "$path" "$url"
            fi
            [ -f "$path" ] && echo "fetched: $path ($(stat -c%s "$path") bytes)" || echo "missing: $path"
          done

      - name: Redact secrets from fetched text files
        run: |
          # Verhindert Push-Protection-Blocks: Tokens in gescannten Seiten schwaerzen
          find .preview-cache -type f \( -name "*.html" -o -name "*.md" -o -name "*.json" -o -name "*.css" -o -name "*.js" \) 2>/dev/null | while read -r f; do
            sed -i -E 's/(sk|pk)\.eyJ[A-Za-z0-9._-]+/REDACTED_TOKEN/g; s/AIza[0-9A-Za-z_-]{35}/REDACTED_TOKEN/g; s/gh[pousr]_[A-Za-z0-9]{30,}/REDACTED_TOKEN/g' "$f" || true
          done

      - name: Commit fetched assets
        run: |
          git config user.name "asset-fetcher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add fetched media assets" || echo "nothing to commit"
          git push
